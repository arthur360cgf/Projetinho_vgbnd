spring:
  config:
    import: optional:file:.env
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/auth_db}"
    username: "${DB_USERNAME:auth_user}"
    password: "${DB_PASSWORD:senha_local}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiration: 900000 # 15 minutos em milissegundos
  refresh-token-expiration: 604800000 # 7 dias em milissegundos